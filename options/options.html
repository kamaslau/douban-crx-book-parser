<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Douban Book Parser - Settings</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="options.css" />
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>Settings</h1>
      </header>

      <main class="main">
        <form id="optionsForm" class="form">
          <fieldset class="section-fieldset">
            <legend>Book API</legend>

            <div class="field-group">
              <label for="remoteUrl">Remote URL</label>
              <input
                type="url"
                id="remoteUrl"
                placeholder="https://api.example.com/webhook"
                required
              />
              <span class="hint">POST endpoint to receive book data</span>
            </div>

            <div class="field-group">
              <label for="authToken">Authorization Token</label>
              <input
                type="password"
                id="authToken"
                placeholder="Enter your token"
                required
              />
              <span class="hint"
                >Token sent as Bearer token in Authorization header</span
              >
            </div>
          </fieldset>

          <fieldset class="section-fieldset">
            <legend>Cloudflare</legend>

            <div class="field-group">
              <label for="r2AccountId">R2 Account ID</label>
              <input
                id="r2AccountId"
                placeholder="Your Cloudflare R2 account ID"
              />
            </div>

            <div class="field-group">
              <label>S3 Endpoint URL</label>
              <input
                id="r2EndpointUrl"
                class="readonly-url"
                readonly
                placeholder="https://<account-id>.r2.cloudflarestorage.com"
              />
              <span class="hint">Auto-generated from R2 Account ID</span>
            </div>

            <div class="field-group">
              <label for="r2ApiTokenKeyId">R2 API Token Key ID</label>
              <input
                id="r2ApiTokenKeyId"
                placeholder="Your R2 API Token key ID"
              />
            </div>

            <div class="field-group">
              <label for="r2ApiTokenKeySecret">R2 API Token Key Secret</label>
              <input
                type="password"
                id="r2ApiTokenKeySecret"
                placeholder="Your R2 API Token key secret"
              />
            </div>

            <div class="field-group">
              <label for="awsBucketName">AWS Bucket Name</label>
              <input
                id="awsBucketName"
                placeholder="Your S3-compatible bucket name"
              />
            </div>
          </fieldset>

          <div id="status" class="status hidden"></div>

          <div class="actions">
            <button type="button" id="testBtn" class="btn btn-secondary">
              Test Connection
            </button>

            <button id="saveBtn" class="btn btn-primary">Save</button>
          </div>
        </form>
      </main>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
